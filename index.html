    }
    if (!drag) edge.t = 0;
    const de = edge.t - edge.x;                     /* 边线越界弹簧：欠阻尼，回弹时允许略微缩回边内 */
    if (Math.abs(de) > 1e-3 || Math.abs(edge.v) > .02) {
      edge.v += ((de * EDGE_K) - edge.v * EDGE_C) * dt;
      edge.x = Math.max(-3, Math.min(EDGE_MAX * 1.5, edge.x + edge.v * dt));
      live = true;
    } else { edge.x = edge.t; edge.v = 0; }
    if (drag && drag.vec) layoutDrag();             /* 位置与形变同帧更新，不会互相穿插 */
    for (const tl of tiles) paintSquash(tl);
    if (live) squashRaf = requestAnimationFrame(squashTick);
    else { squashRaf = 0; squashLast = 0; }
  }
  function paintSquash(tl) {
    const q = Math.max(-.4, Math.min(1, tl.sq));    /* 视觉上绝不超过 1/4 边长 */
    if (q < SQ_EPS && q > -SQ_EPS) {
      if (tl.sqDrawn) { tl.sqEl.style.transform = ''; tl.sqEl.style.transformOrigin = ''; tl.sqDrawn = false; }
      return;
    }
    const comp = q * MAXDEF, bulge = q * MAXBULGE;
    tl.sqEl.style.transformOrigin = tl.sqOrigin;
    tl.sqEl.style.transform = 'scale(' + (tl.sqAxis === 'x' ? 1 - comp : 1 + bulge).toFixed(4) + ',' +
      (tl.sqAxis === 'x' ? 1 + bulge : 1 - comp).toFixed(4) + ')';
    tl.sqDrawn = true;
  }
  function dragGeo() {
    const boxes = [];
    for (let i = 0; i < 16; i++) boxes.push([cells[i].offsetLeft, cells[i].offsetTop]);
    return { boxes, cw: cells[0].offsetWidth,
      stepx: cells[1].offsetLeft - cells[0].offsetLeft,
      stepy: cells[4].offsetTop - cells[0].offsetTop,
      w: tilesEl.clientWidth, h: tilesEl.clientHeight };
  }
  /* 一次布局：算每块的限位 → 目标压缩量 → 翻译位置。
     前缘被边线或前一块挡住后，手指继续推的溢出量越大压缩越深；
     前一块压缩后尾缘回收，给后一块腾出位置，于是挤压沿队列往后退。 */
  function layoutDrag() {
    const g = drag.geo, v = drag.vec;
    const horiz = v[1] !== 0, sign = (horiz ? v[1] : v[0]) > 0 ? 1 : -1;
    const cw = g.cw, step = horiz ? g.stepx : g.stepy, layer = horiz ? g.w : g.h, maxC = cw * MAXDEF;
    const ex = Math.max(-3, Math.min(EDGE_MAX * 1.5, edge.x)) * sign;
    let edgeOver = 0;
    const lines = {};
    for (const tl of tiles) { const k = horiz ? tl.r : tl.c; (lines[k] = lines[k] || []).push(tl); }
    for (const k in lines) {
      const line = lines[k];
      line.sort((a, b) => sign > 0 ? (horiz ? b.c - a.c : b.r - a.r) : (horiz ? a.c - b.c : a.r - b.r));
      let limit = null;
      for (let i = 0; i < line.length; i++) {
        const tl = line[i], co = horiz ? tl.c : tl.r;
        const want = (sign > 0 ? co * step + cw : co * step) + sign * (tl.off || 0);
        let lead;
        if (i === 0) {                              /* 队列最前一块：限位来自棋盘边线，可轻微越界 */
          const wall = sign > 0 ? layer : 0, edgeLim = wall + ex;
          lead = sign > 0 ? Math.min(want, edgeLim) : Math.max(want, edgeLim);
          const beyond = sign > 0 ? want - wall : wall - want;
          if (beyond > edgeOver) edgeOver = beyond;
        } else {
          lead = sign > 0 ? Math.min(want, limit) : Math.max(want, limit);
        }
        const over = Math.abs(want - lead);
        const base = Math.min(SQ_BASE, (tl.off || 0) / 140);   /* 每块按自身跟手位移先有一点指压形变 */
        const target = Math.min(SQ_CAP, Math.max(base, over / maxC * SQ_GAIN));
        tl.sqT = target;
        if (target > .02) {
          tl.sqAxis = horiz ? 'x' : 'y';
          tl.sqOrigin = horiz ? (sign > 0 ? '100% 50%' : '0% 50%') : (sign > 0 ? '50% 100%' : '50% 0%');
        }
        const along = sign > 0 ? lead - cw : lead;
        const p = g.boxes[tl.r * GameCore.N + tl.c];
        tl.el.style.transition = 'none';
        tl.el.style.transform = 'translate(' + (horiz ? along : p[0]) + 'px,' + (horiz ? p[1] : along) + 'px)';
        tl.el.style.zIndex = String(50 - i);
        const cVis = Math.min(1, Math.max(0, tl.sq)) * maxC;   /* 与实际绘制一致的已显示压缩量 */
        limit = sign > 0 ? along + cVis : along + cw - cVis;
      }
    }
    edge.t = Math.min(EDGE_MAX, edgeOver * EDGE_GAIN);
  }

  /* ---------- 移动动画 ---------- */
  let fxRec = null;          /* 当前这一手尚未播完的收尾动作，可被下一次输入提前结算 */
  let vanishing = [];        /* 正在雾化消散的被吸收方块 */
  let undoing = false, undoTimers = [], undoAnims = [];   /* 撤回动画状态 */
  const r3 = (v) => +v.toFixed(3);

  function clearVanishing() {
    for (const g of vanishing) { clearTimeout(g.timer); g.el.remove(); }
    vanishing = [];
  }
  function abortAnims() {
    clearVanishing();
    const f = fxRec;
    if (!f) return;
    fxRec = null;
    f.timers.forEach(clearTimeout);
    f.anims.forEach(a => { try { a.cancel(); } catch (e) {} });
  }
  /* 中止撤回动画（新游戏等）：清掉定时器与 WAAPI，恢复输入 */
  function cancelUndo() {
    for (const id of undoTimers) clearTimeout(id);
    undoTimers = [];
    for (const a of undoAnims) { try { a.cancel(); } catch (e) {} }
    undoAnims = [];
    if (undoing) { undoing = false; busy = false; }
  }
  /* 把上一手瞬间播完：结算合并、清掉残影、立即落定 */
  function flushMove() {
    const f = fxRec;
    if (!f) { clearVanishing(); return; }
    fxRec = null;
    f.timers.forEach(clearTimeout);
    f.anims.forEach(a => { try { a.cancel(); } catch (e) {} });
    clearVanishing();
    f.finish();
    repositionAll();
    busy = false;
  }
  /* 滑行：先按 cubic-bezier(.2,.85,.3,1) 推过头 ov 像素，再按 (.3,1.5,.5,1) 弹回落位 */
  function flyTo(tl, vec, ov) {
    const p = cellBox(tl.r, tl.c);
    tl.el.style.transition = 'transform ' + DUR_PUSH + 'ms cubic-bezier(.2,.85,.3,1)';
    tl.el.style.transform = 'translate(' + (p[0] + vec[1] * ov) + 'px,' + (p[1] + vec[0] * ov) + 'px)';
    return setTimeout(() => {
      tl.el.style.transition = 'transform ' + DUR_SETTLE + 'ms cubic-bezier(.3,1.5,.5,1)';
      tl.el.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
    }, DUR_PUSH);
  }

  function performMove(dir) {
    if (undoing) return false;             /* 撤回动画播放中：忽略新的移动 */
    if (busy) flushMove();                 /* 上一手没播完：先瞬间收尾，这一手立刻接管 */
    if (over || drag) return false;        /* 拖拽进行中：这一手归松手时结算，键盘不插手 */
    const res = GameCore.move(grid, dir);
    if (!res.moved) return false;          /* 无效移动：无反馈，保持安静 */

    /* 撤回快照：数字盘面之外，再记下每个方块的身份/位置/数值，
       以及这一手发生的合并配对，供「原路返回 + 合并块分裂」动画使用 */
    const snapshot = {
      grid: grid.slice(), score,
      view: tiles.map(tl => ({ id: tl.id, r: tl.r, c: tl.c, v: tl.v })),
      merges: []
    };
    undoStack.push(snapshot);
    if (undoStack.length > 20) undoStack.shift();
    const prevScore = score;
    if (reduced()) return settleInstant(res, prevScore);

    /* 目标位置由纯函数计算（与 GameCore.move 结果一致），视图层照此迁移 */
    const tileList = [];
    for (let i = 0; i < 16; i++) {
      if (grid[i]) tileList.push({ id: i, row: Math.floor(i / GameCore.N), col: i % GameCore.N, value: grid[i] });
    }
    const plan = GameCore.planTiles(tileList, dir);
    const vec = VEC[dir];
    const cw = cells[0].offsetWidth;
    const ov = Math.max(4, Math.min(9, Math.round(cw * .055)));   /* 过冲量随格子缩放 */

    for (const p of plan) {
      const tl = tileGrid[p.id];
      tl.sr = Math.floor(p.id / GameCore.N); tl.sc = p.id % GameCore.N;
      tl.r = p.target.row; tl.c = p.target.col;
      p.tl = tl;
    }
    /* 被吸收的方块脱离视图模型（不再参与挤压与后续排布），DOM 留给雾化消散 */
    const deadSet = new Set(plan.filter(p => p.dead).map(p => p.tl));
    tiles = tiles.filter(tl => !deadSet.has(tl));
    tileGrid = new Array(16).fill(null);
    for (const tl of tiles) tileGrid[tl.r * GameCore.N + tl.c] = tl;

    const f = { timers: [], anims: [], applies: [], finished: false, finish: null };
    fxRec = f;
    busy = true;
    let appliedScore = 0;

    for (const p of plan) {
      const tl = p.tl;
      if (tl.sr !== tl.r || tl.sc !== tl.c || p.dead) f.timers.push(flyTo(tl, vec, ov));
      else {
        /* 未位移的方块也要用带过冲的曲线收尾：拖拽期间它可能被顶偏了几像素 */
        tl.el.style.transition = 'transform ' + MOVE_TOTAL + 'ms cubic-bezier(.25,1.55,.4,1)';
        settleAt(tl);
      }
    }

    let mergedAny = false;
    const byTarget = new Map();
    for (const p of plan) {
      const k = p.target.row * GameCore.N + p.target.col;
      if (!byTarget.has(k)) byTarget.set(k, []);
      byTarget.get(k).push(p);
    }
    for (const list of byTarget.values()) {
      const se = list.find(p => p.merged), de = list.find(p => p.dead);
      if (!se || !de) continue;
      mergedAny = true;
      const s = se.tl, a = de.tl;
      snapshot.merges.push([s.id, a.id]);
      /* 起雾时刻 tc：反解滑行贝塞尔，取两者间距收到一格宽的那一瞬 */
      const pa = cellCenter(a.sr, a.sc), ps = cellCenter(s.sr, s.sc);
      const S0 = Math.max(Math.abs(pa[0] - ps[0]), Math.abs(pa[1] - ps[1]));
      const tc = Math.min(DUR_PUSH, Math.max(6, tOfProgress(1 - cw / S0) * DUR_PUSH));

      const anS = s.fxEl.animate([
        { offset: 0, filter: 'blur(0px)' },
        { offset: r3(tc / DUR_FUSE), filter: 'blur(0px)', easing: 'ease-in' },
        { offset: r3(DUR_PUSH / DUR_FUSE), filter: 'blur(6px)', easing: 'ease-out' },
        { offset: 1, filter: 'blur(0px)' }
      ], { duration: DUR_FUSE, delay: MERGE_DELAY });
      const anA = a.fxEl.animate([
        { offset: 0, filter: 'blur(0px)', opacity: 1 },
        { offset: r3(tc / DUR_VANISH), filter: 'blur(0px)', opacity: 1, easing: 'ease-in' },
        { offset: r3(DUR_PUSH / DUR_VANISH), filter: 'blur(6px)', opacity: 1, easing: 'ease-out' },
        { offset: .55, filter: 'blur(0px)', opacity: .6 },
        { offset: .95, filter: 'blur(0px)', opacity: 0 },
        { offset: 1, filter: 'blur(0px)', opacity: 0 }
      ], { duration: DUR_VANISH, delay: MERGE_DELAY, fill: 'forwards' });
      const anPop = s.inner.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(.9)', offset: .28 },
        { transform: 'scale(1.07)', offset: .62 },
        { transform: 'scale(1)' }
      ], { duration: 300, delay: MERGE_DELAY + tc });
      f.anims.push(anS, anA, anPop);

      /* 数字在模糊峰值处静默替换 —— 看不见跳变，只看见两块并成一块 */
      let applied = false;
      const apply = () => {
        if (applied) return; applied = true;
        s.v *= 2;
        setFace(s.inner, s.v);
        /* 计分与数字同帧变化：参考版在合并瞬间就加分，不必等整手收尾 */
        score += s.v;
        appliedScore += s.v;
        updateHUD(prevScore);
      };
      f.applies.push(apply);
      f.timers.push(setTimeout(apply, MERGE_DELAY));

      a.sq = 0; a.sqv = 0; a.sqT = 0;
      a.sqEl.style.transform = ''; a.sqEl.style.transformOrigin = '';
      a.fxEl.classList.remove('spawn');
      tilesEl.appendChild(a.el);            /* 抬到结果方块之上，消散时才不会被压在下层 */
      vanishing.push({ el: a.el, timer: setTimeout(() => {
        a.el.remove();
        vanishing = vanishing.filter(x => x.el !== a.el);
      }, MERGE_DELAY + DUR_VANISH + 10) });
    }

    f.finish = () => {
      if (f.finished) return;
      f.finished = true;
      if (fxRec === f) fxRec = null;
      for (const fn of f.applies) fn();
      finishTurn(res, prevScore, appliedScore);
    };
    f.timers.push(setTimeout(() => { if (fxRec === f) f.finish(); }, mergedAny ? MERGE_TOTAL : MOVE_TOTAL));
    return true;
  }
  /* 落定：写入规则层结果、生成新块、刷新分数与终局判定 */
  function finishTurn(res, prevScore, appliedScore) {
    grid = res.grid;
    score += res.score - (appliedScore || 0);   /* 合并时已在 apply 里计过分，这里只补剩余 */
    const np = GameCore.addRandomTile(grid);
    if (np !== null) makeTile(Math.floor(np / GameCore.N), np % GameCore.N, grid[np], 0);
    if (!appliedScore) updateHUD(prevScore);    /* 合并局的分数/最高分已在合并瞬间刷新 */
    busy = false;
    checkEnd();
    saveState();
    return true;
  }
  /* 降级路径：不播动画，直接按最终棋盘重建方块层（视图与规则层必须同步） */
  function settleInstant(res, prevScore) {
    grid = res.grid;
    score += res.score;
    GameCore.addRandomTile(grid);
    rebuild(false);
    updateHUD(prevScore);
    busy = false;
    checkEnd();
    saveState();
    return true;
  }
  function checkEnd() {
    if (over) return;
    if (!winShown && GameCore.hasWon(grid)) {
      winShown = true;
      setTimeout(() => showDialog('dialog.win.title', 'dialog.win.text', true), 260);
    } else if (!GameCore.canMove(grid)) {
      over = true;
      setTimeout(() => showDialog('dialog.over.title', 'dialog.over.text', false), 260);
    }
  }

  /* ============================================================
     终局破碎：结束对话框点「再来一局」时，整盘方块炸成碎片再开新局
     · 方块被抖动的网格切成不规则碎片，约一半再沿对角线劈成三角
     · 每块同时闪一圈白光；碎片沿「方块中心 → 碎片重心」飞散
     · 越远离棋盘中心的方块起爆越晚，爆裂从中间荡开
     ============================================================ */
  const shatter = { layer: null, timers: [], anims: [], busy: false };
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* 切碎一块方块：边界点钉死，碎片合起来与原方块严丝合缝 */
  function shardPolys(w, h) {
    const cols = Math.random() < .5 ? 3 : 4, rows = Math.random() < .5 ? 3 : 4, pts = [];
    for (let j = 0; j <= rows; j++) {
      pts[j] = [];
      for (let i = 0; i <= cols; i++) {
        const ex = (i === 0 || i === cols), ey = (j === 0 || j === rows);
        pts[j][i] = [i / cols * w + (ex ? 0 : rnd(-.35, .35) * w / cols),
                     j / rows * h + (ey ? 0 : rnd(-.35, .35) * h / rows)];
      }
    }
    const out = [];
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i + 1], d = pts[j + 1][i];
        if (Math.random() < .45) {
          if (Math.random() < .5) { out.push([a, b, c]); out.push([a, c, d]); }
          else { out.push([a, b, d]); out.push([b, c, d]); }
        } else out.push([a, b, c, d]);
      }
    }
    return out;
  }

  function cancelShatter() {
    for (const id of shatter.timers) clearTimeout(id);
    shatter.timers = [];
    for (const a of shatter.anims) { try { a.cancel(); } catch (e) {} }
    shatter.anims = [];
    if (shatter.layer) { shatter.layer.remove(); shatter.layer = null; }
    shatter.busy = false;
    boardEl.style.overflow = '';
    for (const tl of tiles) tl.el.style.visibility = '';
  }

  function playShatter(onDone) {
    if (reduced()) { if (onDone) onDone(); return; }
    const layer = document.createElement('div');
    layer.className = 'shatter-layer';
    layer.setAttribute('aria-hidden', 'true');
    tilesEl.appendChild(layer);
    shatter.layer = layer;
    shatter.busy = true;
    boardEl.style.overflow = 'hidden';             /* 碎片只在棋盘内飞溅 */

    const cw = cells[0].offsetWidth, ch = cells[0].offsetHeight;
    const bx = tilesEl.clientWidth / 2, by = tilesEl.clientHeight / 2;
    let end = 0;
    shatter.anims.push(boardEl.animate([           /* 破碎瞬间整盘轻微震一下 */
      { transform: 'translate(0,0)' },
      { transform: 'translate(-3px,2px)', offset: .12 },
      { transform: 'translate(4px,-3px)', offset: .27 },
      { transform: 'translate(-3px,-2px)', offset: .44 },
      { transform: 'translate(3px,2px)', offset: .62 },
      { transform: 'translate(-2px,-1px)', offset: .8 },
      { transform: 'translate(0,0)' }
    ], { duration: 430, easing: 'ease-out' }));

    for (const tl of tiles) {
      const [x, y] = cellBox(tl.r, tl.c), cx = x + cw / 2, cy = y + ch / 2;
      tl.el.style.visibility = 'hidden';           /* 原方块藏起来，由碎片顶替它的样子 */
      const tBase = Math.min(170, Math.hypot(cx - bx, cy - by) * .2 + rnd(0, 70));

      const f = rnd(.25, .4) * cw;                 /* 破裂瞬间的白光爆闪 */
      const flash = document.createElement('div');
      flash.className = 'shatter-flash';
      flash.style.cssText = 'left:' + (cx - f) + 'px;top:' + (cy - f) + 'px;width:' + (f * 2) + 'px;height:' + (f * 2) + 'px';
      layer.appendChild(flash);
      shatter.anims.push(flash.animate([
        { opacity: 0, transform: 'scale(.35)' },
        { opacity: .95, offset: .22 },
        { opacity: 0, transform: 'scale(1.25)' }
      ], { duration: 430, delay: tBase, easing: 'ease-out', fill: 'forwards' }));

      for (const poly of shardPolys(cw, ch)) {
        let gx = 0, gy = 0;
        for (const p of poly) { gx += p[0]; gy += p[1]; }
        gx /= poly.length; gy /= poly.length;
        const sh = document.createElement('div');
        sh.className = 'shatter-shard';
        sh.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + cw + 'px;height:' + ch + 'px;clip-path:polygon(' +
          poly.map(p => (p[0] / cw * 100).toFixed(2) + '% ' + (p[1] / ch * 100).toFixed(2) + '%').join(',') + ')';
        const cp = tl.inner.cloneNode(true);       /* 碎片里嵌一份方块本体，由 clip-path 裁出自己那一角 */
        sh.appendChild(cp);
        layer.appendChild(sh);

        let ang = Math.atan2(y + gy - cy, x + gx - cx);   /* 飞溅方向 = 方块中心 → 碎片重心 */
        if (Math.hypot(x + gx - cx, y + gy - cy) < cw * .18 || Math.random() < .18) ang = rnd(-Math.PI, Math.PI);
        const sp = rnd(60, 175), dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp, fall = rnd(70, 170);
        const rot = rnd(-220, 220), dur = rnd(650, 950), delay = tBase + rnd(0, 70);
        shatter.anims.push(sh.animate([
          { transform: 'translate3d(0,0,0) rotate(0deg) scale(1)', opacity: 1, easing: 'cubic-bezier(.1,.55,.3,1)' },
          { transform: 'translate3d(' + (dx * .72).toFixed(1) + 'px,' + (dy * .72 + fall * .14).toFixed(1) + 'px,0) rotate(' +
              (rot * .6).toFixed(1) + 'deg) scale(.96)', opacity: 1, offset: .55, easing: 'cubic-bezier(.5,0,.9,.6)' },
          { transform: 'translate3d(' + (dx * 1.3).toFixed(1) + 'px,' + (dy * 1.3 + fall).toFixed(1) + 'px,0) rotate(' +
              rot.toFixed(1) + 'deg) scale(.78)', opacity: 0 }
        ], { duration: dur, delay: delay, fill: 'forwards' }));
        end = Math.max(end, delay + dur);
      }
    }

    const showAt = end + 70;                       /* 碎片落定 → 交给调用方开新局 */
    shatter.timers.push(setTimeout(() => { if (onDone) onDone(); }, showAt));
    shatter.timers.push(setTimeout(() => {
      if (shatter.layer === layer) { layer.remove(); shatter.layer = null; }
    }, showAt + 700));
  }

  /* 结束后的重开：遮罩淡出与爆裂同时开始，碎片落定后再刷新棋盘 */
  function restartAfterOver() {
    if (shatter.busy) return;
    hideDialog();
    playShatter(() => newGame(true));
  }

  /* ---------- 撤销：原路返回 ----------
     1) 上一手新生成的方块就地缩小、模糊、淡出；
     2) 其余方块沿上一手的反方向滑回原位；
     3) 合并块在目标格分裂：被吸收的一半滑回自己的原格，
        幸存方块在原位短暂模糊，把数字换回合并前的值。
     动画期间锁住棋盘输入；新游戏会中止动画并直接接管。 */
  function undo() {
    if (undoing) return;
    if (busy) flushMove();
    if (over || undoStack.length === 0) return;
    const snap = undoStack.pop();
    const shown = parseInt(scoreEl.textContent, 10);
    const prevScore = Number.isFinite(shown) ? shown : score;
    score = snap.score;

    if (reduced()) {                        /* 降级：不播动画，直接回到快照 */
      grid = snap.grid;
      rebuild(false);
      updateHUD();
      snack(t('snack.undo'));
      saveState();
      return;
    }

    /* 视图身份对不上（例如刚在减少动态效果下走过一手）时，退化为直接重建 */
    const curById = new Map(tiles.map(tl => [tl.id, tl]));
    const snapById = new Map(snap.view.map(v => [v.id, v]));
    const spawned = tiles.filter(tl => !snapById.has(tl.id));
    const mapped = snap.view.filter(v => curById.has(v.id)).length;
    if (spawned.length !== 1 || mapped !== snap.view.length - snap.merges.length) {
      grid = snap.grid;
      rebuild(false);
      updateHUD();
      snack(t('snack.undo'));
      saveState();
      return;
    }

    undoing = true;
    busy = true;
    drag = null;
    edge.x = 0; edge.v = 0; edge.t = 0;
    stopSquash();
    for (const tl of tiles) {                /* 清掉可能残留的挤压形变、入场动画与拖拽层级 */
      tl.sq = 0; tl.sqv = 0; tl.sqT = 0;
      tl.sqEl.style.transform = '';
      tl.sqEl.style.transformOrigin = '';
      tl.el.style.zIndex = '';
      tl.fxEl.classList.remove('spawn');
    }
    updateHUD(prevScore);                    /* 分数同步回滚 */
    snack(t('snack.undo'));

    const RETURN = 340, SPAWN_OUT = 220, SWAP_AT = 70, BLUR = 260;
    const sp = spawned[0];
    const spTf = sp.el.style.transform || 'translate(0px,0px)';
    undoAnims.push(sp.el.animate([
      { transform: spTf + ' scale(1)', filter: 'blur(0px)', opacity: 1 },
      { transform: spTf + ' scale(.5)', filter: 'blur(6px)', opacity: 0 }
    ], { duration: SPAWN_OUT, easing: 'cubic-bezier(.4,0,.7,1)', fill: 'forwards' }));

    /* 非合并方块：滑回上一手的位置 */
    for (const tl of tiles) {
      if (tl === sp) continue;
      const sv = snapById.get(tl.id);
      if (!sv || (sv.r === tl.r && sv.c === tl.c)) continue;
      const tf = tl.el.style.transform || 'translate(0px,0px)';
      const p = cellBox(sv.r, sv.c);
      undoAnims.push(tl.el.animate([
        { transform: tf },
        { transform: 'translate(' + p[0] + 'px,' + p[1] + 'px)' }
      ], { duration: RETURN, easing: 'cubic-bezier(.25,1.15,.4,1)', fill: 'forwards' }));
    }

    /* 合并块分裂：吸收块从目标格分离并滑回原格；幸存块换回合并前的数字 */
    const ghostById = new Map();
    for (const pair of snap.merges) {
      const s = curById.get(pair[0]);
      const av = snapById.get(pair[1]);
      if (!s || !av) continue;
      const from = cellBox(s.r, s.c);
      const to = cellBox(av.r, av.c);
      const tf0 = 'translate(' + from[0] + 'px,' + from[1] + 'px)';
      const tf1 = 'translate(' + to[0] + 'px,' + to[1] + 'px)';
      const ghost = makeTile(s.r, s.c, av.v, false, true);
      ghost.id = av.id;                      /* 还原身份：连续撤回时更早的快照仍能对上 */
      ghost.el.style.zIndex = '60';
      tilesEl.appendChild(ghost.el);
      ghostById.set(av.id, ghost);
      undoAnims.push(ghost.el.animate([
        { transform: tf0 + ' scale(.8)', opacity: 0, easing: 'ease-out' },
        { transform: tf0 + ' scale(1)', opacity: 1, offset: .18, easing: 'cubic-bezier(.25,1.15,.4,1)' },
        { transform: tf1, opacity: 1 }
      ], { duration: RETURN, fill: 'forwards' }));
      undoAnims.push(s.fxEl.animate([
        { filter: 'blur(0px)' },
        { filter: 'blur(6px)', offset: .32 },
        { filter: 'blur(0px)' }
      ], { duration: BLUR, easing: 'ease-in-out' }));
    }
    if (snap.merges.length) {
      undoTimers.push(setTimeout(() => {
        for (const pair of snap.merges) {
          const s = curById.get(pair[0]);
          const sv = snapById.get(pair[0]);
          if (s && sv) { s.v = sv.v; setFace(s.inner, s.v); }
        }
      }, SWAP_AT));
    }

    /* 收尾：按快照统一落位，清掉临时动画与分裂半块的临时层级 */
    undoTimers.push(setTimeout(() => {
      for (const a of undoAnims) { try { a.cancel(); } catch (e) {} }
      undoAnims = [];
      if (sp.el.parentNode) sp.el.remove();
      const finalTiles = [];
      for (const sv of snap.view) {
        const tl = curById.get(sv.id) || ghostById.get(sv.id);
        if (!tl) continue;
        tl.r = sv.r; tl.c = sv.c; tl.sr = sv.r; tl.sc = sv.c; tl.v = sv.v;
        setFace(tl.inner, tl.v);
        tl.el.style.transition = 'none';
        tl.el.style.zIndex = '';
        if (tl.el.parentNode !== tilesEl) tilesEl.appendChild(tl.el);
        settleAt(tl);
        finalTiles.push(tl);
      }
      tiles = finalTiles;
      tileGrid = new Array(16).fill(null);
      for (const tl of tiles) tileGrid[tl.r * GameCore.N + tl.c] = tl;
      grid = snap.grid;
      undoing = false;
      busy = false;
      undoBtn.disabled = undoStack.length === 0;
      undoTimers = [];
      saveState();
    }, RETURN + 100));
  }

  /* ---------- 新游戏 ---------- */
  /* quiet=true：从破碎动画收尾过来，棋盘不重新淡入，新块直接在空盘上入场 */
  function newGame(quiet) {
    cancelUndo();
    cancelShatter();
    abortAnims();
    stopSquash();
    drag = null;
    edge.x = 0; edge.v = 0; edge.t = 0;
    undoStack = [];
    grid = GameCore.emptyGrid();
    score = 0;
    winShown = false; over = false; busy = false;
    GameCore.addRandomTile(grid);
    GameCore.addRandomTile(grid);
    rebuild(true);
    updateHUD();
    if (!quiet) {
      /* 新一局棋盘淡入 */
      boardEl.classList.remove('regen');
      void boardEl.offsetWidth;
      boardEl.classList.add('regen');
    }
    snack(t('snack.newGame'));
    saveState();
  }

  /* ---------- 对话框 ---------- */
  function showDialog(titleKey, textKey, canContinue) {
    dialogTitle.textContent = t(titleKey);
    dialogText.textContent = t(textKey);
    dialogScore.textContent = t('dialog.finalScore', { score });
    dialogContinue.style.display = canContinue ? '' : 'none';
    scrimEl.classList.add('show');
    syncModalOpen();
    (canContinue ? dialogContinue : dialogAgain).focus();
  }
  function hideDialog() {
    scrimEl.classList.remove('show');
    syncModalOpen();
    /* 弹窗按钮仍持有焦点：主动失焦，避免遮罩隐身期间回车/空格再次触发重开 */
    if (document.activeElement && scrimEl.contains(document.activeElement)) document.activeElement.blur();
  }
  dialogAgain.addEventListener('click', () => {
    if (over) restartAfterOver();
    else { hideDialog(); newGame(); }
  });
  dialogContinue.addEventListener('click', () => { hideDialog(); over = false; });
  scrimEl.addEventListener('click', (e) => { if (e.target === scrimEl) hideDialog(); });

  /* ---------- Snackbar ---------- */
  function snack(msg) {
    snackbarEl.textContent = msg;
    snackbarEl.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbarEl.classList.remove('show'), 2600);
  }

  /* ---------- 输入：键盘 ---------- */
  const KEY_DIR = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  document.addEventListener('keydown', (e) => {
    const dir = KEY_DIR[e.key];
    if (!dir) return;
    e.preventDefault();
    performMove(dir);
  });

  /* ---------- 输入：跟手拖拽（触摸 / 鼠标） ----------
     按下即接管棋盘，方向在越过 LOCK 的那一帧锁定；此后手指的溢出量实时喂给
     弹簧层做挤压，松手时按已跟手的位移结算这一手 —— 所以块是被「推」过去的，
     而不是松手后才开始动 */
  const DAMP = .62, LOCK = 10;
  let ptrStart = null;
  function onPointerDown(e) {
    if (!e.isPrimary) return;
    if (undoing) return;                   /* 撤回动画播放中：不接管手势 */
    if (reduced()) { ptrStart = { x: e.clientX, y: e.clientY }; return; }   /* 降级：退回离散滑动 */
    if (busy) flushMove();                     /* 手指一落下就把上一手收掉，立刻能接管 */
    if (over) return;
    if (!drag) { edge.x = 0; edge.v = 0; edge.t = 0; }
    const br = boardEl.getBoundingClientRect();
    const ox = br.left + tilesEl.offsetLeft, oy = br.top + tilesEl.offsetTop;
    for (const tl of tiles) tl.off = 0;
    drag = { sx: e.clientX, sy: e.clientY, px: e.clientX - ox, py: e.clientY - oy,
             ox, oy, vec: null, dir: null, d: 0, geo: dragGeo() };
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.vec) {
      if (Math.hypot(dx, dy) < LOCK) return;
      if (busy) flushMove();
      if (over) { drag = null; return; }
      const h = Math.abs(dx) > Math.abs(dy);
      drag.vec = h ? (dx > 0 ? VEC.right : VEC.left) : (dy > 0 ? VEC.down : VEC.up);
      drag.dir = h ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      busy = true;
    }
    drag.d = Math.max(0, (dx * drag.vec[1] + dy * drag.vec[0]) * DAMP);
    drag.px = e.clientX - drag.ox; drag.py = e.clientY - drag.oy;
    layoutDrag();
    startSquash();
  }
  function snapback() {
    for (const tl of tiles) {
      tl.el.style.transition = 'transform .24s cubic-bezier(.3,1.4,.5,1)';
      settleAt(tl);
    }
  }
  function endDrag() {
    const d = drag; drag = null;
    if (!d.vec) return;
    busy = false;
    for (const tl of tiles) tl.el.style.zIndex = '';
    releaseSquash();                 /* 松手：目标压缩归零，弹簧自己带过冲回弹 */
    if (d.d < LOCK) { snapback(); return; }
    if (!performMove(d.dir)) snapback();
  }
  function onPointerUp(e) {
    if (drag) { endDrag(); return; }
    if (!ptrStart) return;
    const dx = e.clientX - ptrStart.x, dy = e.clientY - ptrStart.y;
    ptrStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) performMove(dx > 0 ? 'right' : 'left');
    else performMove(dy > 0 ? 'down' : 'up');
  }
  boardEl.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  /* 系统打断手势（多指、手势切换）时按松手同样结算，避免方块停在半途、busy 锁死 */
  window.addEventListener('pointercancel', onPointerUp);

  /* ---------- 按钮 ---------- */
  newGameBtn.addEventListener('click', () => {
    if (over) restartAfterOver();     /* 终局后的重开：先炸碎旧盘 */
    else newGame();
  });
  undoBtn.addEventListener('click', undo);

  /* 波纹 */
  function ripple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const d = Math.max(rect.width, rect.height) * 2.1;
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = d + 'px';
    span.style.left = (e.clientX - rect.left - d / 2) + 'px';
    span.style.top = (e.clientY - rect.top - d / 2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 600);
  }
  for (const btn of document.querySelectorAll('.btn')) {
    btn.addEventListener('pointerdown', ripple);
  }

  /* ---------- 设置面板（配色方案） ---------- */
  const settingsScrim = $('settingsScrim'), settingsBtn = $('settingsBtn');
  /* 任一模态层开关后同步 html[data-modal]，驱动背后界面的下沉动画 */
  function syncModalOpen() {
    const open = scrimEl.classList.contains('show') || settingsScrim.classList.contains('show');
    if (open) document.documentElement.setAttribute('data-modal', 'open');
    else document.documentElement.removeAttribute('data-modal');
  }
  settingsBtn.addEventListener('click', () => {
    settingsScrim.classList.add('show');
    syncModalOpen();
    $('settingsClose').focus();
  });
  settingsScrim.addEventListener('click', (e) => {
    if (e.target === settingsScrim) { settingsScrim.classList.remove('show'); syncModalOpen(); }
  });
  $('settingsClose').addEventListener('click', () => { settingsScrim.classList.remove('show'); syncModalOpen(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { settingsScrim.classList.remove('show'); syncModalOpen(); }
  });
  /* 配色方案：guofeng（国风）| classic（经典），持久化并即时生效 */
  document.querySelectorAll('.palette-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const p = opt.dataset.palette;
      document.documentElement.setAttribute('data-palette', p);
      try { localStorage.setItem('md2048-palette', p); } catch (e) {}
      for (const o of document.querySelectorAll('.palette-option')) {
        o.classList.toggle('active', o === opt);
      }
    });
  });
  (function syncPaletteUI() {
    const cur = document.documentElement.getAttribute('data-palette') || 'guofeng';
    for (const o of document.querySelectorAll('.palette-option')) {
      o.classList.toggle('active', o.dataset.palette === cur);
    }
  })();

  /* ---------- 平板模式（操作按钮停靠屏幕右端） ----------
     首屏属性已由 <head> 里的预置脚本恢复；这里只同步开关状态并处理切换 */
  const tabletToggle = $('tabletToggle');
  const TABLET_KEY = 'md2048-tablet';
  let tabletOn = document.documentElement.getAttribute('data-tablet') === 'on';
  function syncTabletUI() {
    document.documentElement.setAttribute('data-tablet', tabletOn ? 'on' : 'off');
    tabletToggle.setAttribute('aria-checked', tabletOn ? 'true' : 'false');
  }
  tabletToggle.addEventListener('click', () => {
    tabletOn = !tabletOn;
    try { localStorage.setItem(TABLET_KEY, tabletOn ? 'on' : 'off'); } catch (e) {}
    syncTabletUI();
  });
  syncTabletUI();

  /* ---------- 全屏（右下角悬浮按钮） ---------- */
  const fsBtn = $('fullscreenBtn');
  /* iOS Safari 无 requestFullscreen，Android 与桌面浏览器可用 */
  const fsSupported = !!fsBtn && !!document.documentElement.requestFullscreen
                      && typeof document.exitFullscreen === 'function'
                      && document.fullscreenEnabled !== false;
  function syncFsUI() {
    if (!fsSupported) return;
    const full = !!document.fullscreenElement;
    fsBtn.classList.toggle('is-full', full);
    const label = t(full ? 'fullscreen.exit' : 'fullscreen.enter');
    fsBtn.setAttribute('aria-label', label);
    fsBtn.setAttribute('title', label);
  }
  if (fsSupported) {
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', () => {
      /* 进入是 Element 方法，退出是 Document 方法，别写成一对 */
      const req = document.fullscreenElement
        ? document.exitFullscreen()
        : document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      /* 手势校验被拒时静默失败，图标状态统一由 fullscreenchange 校准 */
      if (req && typeof req.catch === 'function') req.catch(() => {});
    });
    document.addEventListener('fullscreenchange', syncFsUI);
  }

  /* ---------- 主题（跟随系统 / 浅色 / 深色；手动选择优先并持久保存） ---------- */
  const themeThumbEl = $('themeThumb');
  const themeSegs = Array.from(document.querySelectorAll('.segment[data-theme-option]'));
  const sysMq = window.matchMedia('(prefers-color-scheme: dark)');
  /* 返回偏好值：'system' | 'light' | 'dark'（未知或未设置时视为跟随系统） */
  function themePref() {
    let stored = null;
    try { stored = localStorage.getItem('md2048-theme'); } catch (e) {}
    return (stored === 'light' || stored === 'dark') ? stored : 'system';
  }
  function applyTheme(pref) {
    const dark = pref === 'system' ? sysMq.matches : pref === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  function syncThemeUI() {
    const pref = themePref();
    let activeSeg = null;
    for (const seg of themeSegs) {
      const on = seg.dataset.themeOption === pref;
      seg.classList.toggle('active', on);
      if (on) activeSeg = seg;
    }
    placeThumb(themeThumbEl, activeSeg);
  }
  themeSegs.forEach(seg => {
    seg.addEventListener('click', () => {
      const pref = seg.dataset.themeOption;
      try { localStorage.setItem('md2048-theme', pref); } catch (e) {}
      applyTheme(pref);
      syncThemeUI();
    });
  });
  /* 选择「跟随系统」时，实时响应系统主题切换 */
  function applySystemTheme(e) {
    if (themePref() !== 'system') return;
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    syncThemeUI();
  }
  if (sysMq.addEventListener) sysMq.addEventListener('change', applySystemTheme);
  else if (sysMq.addListener) sysMq.addListener(applySystemTheme);   /* 旧 Safari */

  /* ============================================================
     背景：关 / 自定义图片
     · 自定义图片只在运行时按 URL 引用，不写进 HTML
     · 选图后用 object URL 立即生效；同一会话内切走再切回仍可恢复
     · 刷新后 object URL 失效，先尝试原文件名（图片与 HTML 同目录时可用）
     · 仍找不到就回退到「关」，并把分段按钮移回「关」
     ============================================================ */
  const BG_KEY = 'md2048-bg', BG_URL_KEY = 'md2048-bg-url', BG_NAME_KEY = 'md2048-bg-name';
  const BG_BLUR_KEY = 'md2048-bg-blur', BG_BLUR_MAX = 40;
  const bgSegs = Array.from(document.querySelectorAll('.segment[data-bg-option]'));
  let bgUrl = '', bgObjectUrl = '', bgSeq = 0;

  function saveBgPref(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function clearBgPref() {
    try {
      localStorage.removeItem(BG_URL_KEY);
      localStorage.removeItem(BG_NAME_KEY);
    } catch (e) {}
  }
  /* 毛玻璃模糊度：0 保持原图清晰，向上加大磨砂感；持久化并同步滑块外观 */
  function readBgBlur() {
    let v = 0;
    try { v = parseInt(localStorage.getItem(BG_BLUR_KEY) || '0', 10); } catch (e) {}
    if (!(v >= 0)) v = 0;
    return Math.min(BG_BLUR_MAX, v);
  }
  function paintBgBlur(v, persist) {
    const blur = Math.min(BG_BLUR_MAX, Math.max(0, parseInt(v, 10) || 0));
    document.documentElement.style.setProperty('--scene-custom-filter',
      blur > 0 ? 'blur(' + blur + 'px) saturate(1.1)' : 'none');
    bgBlurRange.value = String(blur);
    bgBlurRange.style.setProperty('--bg-blur-fill', (blur / BG_BLUR_MAX * 100) + '%');
    bgBlurRange.setAttribute('aria-valuetext', blur + ' px');
    if (persist) saveBgPref(BG_BLUR_KEY, String(blur));
  }
  function setBgMode(mode) {
    document.documentElement.setAttribute('data-bg', mode);
    let active = null;
    for (const seg of bgSegs) {
      const on = seg.dataset.bgOption === mode;
      seg.classList.toggle('active', on);
      if (on) active = seg;
    }
    placeThumb(bgThumbEl, active);
    bgPickBtn.hidden = mode !== 'custom';
    bgBlurRow.hidden = mode !== 'custom';
  }
  function showBgError(show) { bgErrorEl.hidden = !show; }
  function paintBg(url, name) {
    bgUrl = url;
    sceneCustomEl.style.backgroundImage = url ? 'url("' + url.replace(/"/g, '%22') + '")' : '';
    const ready = !!url;
    sceneEl.classList.toggle('custom-ready', ready);
    bgPreviewEl.hidden = !ready;
    if (ready) bgPreviewEl.src = url; else bgPreviewEl.removeAttribute('src');
    bgPickIcon.classList.toggle('is-hidden', ready);
    bgPickText.dataset.i18n = ready ? 'bg.change' : 'bg.pick';
    bgPickText.textContent = t(ready ? 'bg.change' : 'bg.pick');
    bgFileNameEl.textContent = ready ? (name || '') : '';
    bgCancelBtn.hidden = !ready;
  }
  function dropCustomBg() {
    if (bgObjectUrl) {
      try { URL.revokeObjectURL(bgObjectUrl); } catch (e) {}
      bgObjectUrl = '';
    }
    paintBg('', '');
    clearBgPref();
  }
  function fallbackBg() {
    dropCustomBg();
    setBgMode('off');
    saveBgPref(BG_KEY, 'off');
    showBgError(true);
  }
  function probeBg(url, ok, fail) {
    if (!url) { fail(); return; }
    const img = new Image();
    img.onload = () => ok();
    img.onerror = () => fail();
    img.src = url;
  }
  function readBgPref() {
    let mode = 'off', url = '', name = '';
    try {
      mode = localStorage.getItem(BG_KEY) || 'off';
      url = localStorage.getItem(BG_URL_KEY) || '';
      name = localStorage.getItem(BG_NAME_KEY) || '';
    } catch (e) {}
    /* 旧版「开」（内置插画）已移除，存量值按「关」处理 */
    if (mode !== 'off' && mode !== 'custom') mode = 'off';
    return { mode: mode, url: url, name: name };
  }
  /* 验证保存的地址：失效时先试同名文件（与 HTML 同目录），再回退「关」 */
  function restoreStoredBg(url, name, seq) {
    const restore = (next) => {
      if (seq !== bgSeq) return;
      paintBg(next, name);
      saveBgPref(BG_URL_KEY, next);
    };
    probeBg(url, () => restore(url), () => {
      if (seq !== bgSeq) return;
      if (name && name !== url) {
        probeBg(name, () => restore(name), () => { if (seq === bgSeq) fallbackBg(); });
      } else fallbackBg();
    });
  }
  function chooseBgMode(mode) {
    bgSeq++;                                   /* 取消仍在验证中的选图 */
    showBgError(false);
    setBgMode(mode);
    saveBgPref(BG_KEY, mode);
    if (mode !== 'custom') { sceneEl.classList.remove('custom-ready'); return; }
    if (bgUrl) { sceneEl.classList.add('custom-ready'); return; }
    /* 本次会话还没加载过图：先试上次保存的地址，失败则回退「关」 */
    const pref = readBgPref();
    sceneEl.classList.remove('custom-ready');
    if (pref.url) restoreStoredBg(pref.url, pref.name, bgSeq);
  }

  bgSegs.forEach(seg => {
    seg.addEventListener('click', () => chooseBgMode(seg.dataset.bgOption));
  });
  bgBlurRange.addEventListener('input', () => paintBgBlur(bgBlurRange.value, false));
  bgBlurRange.addEventListener('change', () => paintBgBlur(bgBlurRange.value, true));
  bgPickBtn.addEventListener('click', () => bgFileEl.click());
  /* 行为 div[role=button]：键盘 Enter/空格 与点击等效打开选图 */
  bgPickBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bgFileEl.click(); }
  });
  /* 取消背景图：清除所选图片并回到「关」；stopPropagation 避免冒泡误触选图 */
  bgCancelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropCustomBg();
    chooseBgMode('off');
  });
  bgFileEl.addEventListener('change', () => {
    const file = bgFileEl.files && bgFileEl.files[0];
    bgFileEl.value = '';                       /* 允许再次选择同一张图 */
    if (!file) return;
    const seq = ++bgSeq;
    const url = URL.createObjectURL(file);
    probeBg(url, () => {
      if (seq !== bgSeq) { try { URL.revokeObjectURL(url); } catch (e) {} return; }
      if (bgObjectUrl) { try { URL.revokeObjectURL(bgObjectUrl); } catch (e) {} }
      bgObjectUrl = url;
      paintBg(url, file.name);
      setBgMode('custom');
      saveBgPref(BG_KEY, 'custom');
      saveBgPref(BG_URL_KEY, url);
      saveBgPref(BG_NAME_KEY, file.name);
      showBgError(false);
    }, () => {
      try { URL.revokeObjectURL(url); } catch (e) {}
      if (seq !== bgSeq) return;
      fallbackBg();
    });
  });

  /* 启动恢复：验证保存的地址；失效时先试同名文件，再回退「关」 */
  paintBgBlur(readBgBlur(), false);
  (function initBg() {
    const pref = readBgPref();
    if (pref.mode !== 'custom') { setBgMode(pref.mode); return; }
    setBgMode('custom');
    if (!pref.url) return;                     /* 选过自定义但还没上传 */
    restoreStoredBg(pref.url, pref.name, ++bgSeq);
  })();

  /* 关闭/刷新时若这一手还没播完，先结算再落盘；撤回收尾前不写半成品 */
  window.addEventListener('pagehide', () => {
    if (undoing) return;
    if (busy && fxRec) { try { flushMove(); } catch (e) {} }
    saveState();
  });

  /* ---------- 启动 ---------- */
  /* 滑块初始定位（无动画） */
  function placeThumbNoAnim(thumb, sel) {
    thumb.style.transition = 'none';
    placeThumb(thumb, document.querySelector(sel + '.active'));
    void thumb.offsetWidth;
    thumb.style.transition = '';
  }
  placeThumbNoAnim(langThumbEl, '.segment[data-lang]');
  syncThemeUI();
  applyLang();
  /* 小屏媒体查询会改变按钮宽度，窗口尺寸变化后重新贴合滑块 */
  let thumbRaf = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(thumbRaf);
    thumbRaf = requestAnimationFrame(() => {
      placeThumbNoAnim(themeThumbEl, '.segment[data-theme-option].active');
      placeThumbNoAnim(langThumbEl, '.segment[data-lang].active');
      placeThumbNoAnim(bgThumbEl, '.segment[data-bg-option].active');
      /* 方块定位用的是实测 px 偏移，棋盘缩放后必须重新贴回格子原点 */
      if (!busy && !drag) repositionAll();
    });
  });
  restoreGame();
}

if (typeof document !== 'undefined' && document.getElementById) {
  boot();
}

/* 测试钩子 */
if (typeof window !== 'undefined') {
  window.GameCore = GameCore;
  window.__2048_TEST__ = { GameCore };
}
</script>
</body>
