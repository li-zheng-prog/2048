<script>
/* 主题预置：No-FOUC —— 首帧渲染前恢复主题偏好与配色方案 */
(function () {
  /* 主题偏好：'light' / 'dark' 为手动选择；'system' 或从未设置时跟随系统 */
  var th = null;
  try { th = localStorage.getItem('md2048-theme'); } catch (e) {}
  var dark = th === 'dark' ||
    (th !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var p = null;
  try { p = localStorage.getItem('md2048-palette'); } catch (e) {}
  document.documentElement.setAttribute('data-palette', p === 'classic' ? 'classic' : 'guofeng');
  var l = null;
  try { l = localStorage.getItem('md2048-lang'); } catch (e) {}
  document.documentElement.setAttribute('data-lang', l === 'en' ? 'en' : 'zh');
  /* 背景模式预置：非自定义一律按「关」处理（含旧版存量的「开」），避免加载后再闪一下 */
  var bg = null;
  try { bg = localStorage.getItem('md2048-bg'); } catch (e) {}
  document.documentElement.setAttribute('data-bg', bg === 'custom' ? 'custom' : 'off');
  /* 平板模式预置：开启时首帧就停靠到右侧，避免先横排再跳过去 */
  var tab = null;
  try { tab = localStorage.getItem('md2048-tablet'); } catch (e) {}
  document.documentElement.setAttribute('data-tablet', tab === 'on' ? 'on' : 'off');
  /* 自定义背景模糊度预置：首帧就生效，避免自定义图先清晰再糊一下 */
  var blur = 0;
  try { blur = parseInt(localStorage.getItem('md2048-bg-blur') || '0', 10); } catch (e) {}
  if (!(blur >= 0)) blur = 0;
  if (blur > 40) blur = 40;
  document.documentElement.style.setProperty('--scene-custom-filter',
    blur > 0 ? 'blur(' + blur + 'px) saturate(1.1)' : 'none');
})();
</script>

  --md-sys-color-on-inverse-surface: #F0F1EA;
  --md-sys-color-error: #BA1A1A;
  --md-sys-color-on-error: #FFFFFF;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.22), 0 1px 3px 1px rgba(0,0,0,.14);
  --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.24), 0 2px 6px 2px rgba(0,0,0,.16);
  --md-sys-elevation-3: 0 4px 8px rgba(0,0,0,.24), 0 8px 24px rgba(0,0,0,.18);
  --md-sys-easing: cubic-bezier(.2, 0, 0, 1);
  --record-gold: #DDAE55;
  --font-ui: 'TimesNewRoman-Web', 'NSimSun-Web', serif;
}
[data-theme="dark"] {
  --record-gold: #E5C06E;
  --md-sys-color-primary: #A6CFB2;
  --md-sys-color-on-primary: #103521;
  --md-sys-color-primary-container: #274C35;
  --md-sys-color-on-primary-container: #C2E8CD;
  --md-sys-color-secondary: #BACCB5;
  --md-sys-color-on-secondary: #253422;
  --md-sys-color-secondary-container: #3B4A37;
  --md-sys-color-on-secondary-container: #D6E8D1;
  --md-sys-color-surface: #11140F;
  --md-sys-color-surface-dim: #10120E;
  --md-sys-color-surface-container-lowest: #0C0E0A;
  --md-sys-color-surface-container-low: #191C16;
  --md-sys-color-surface-container: #1D201A;
  --md-sys-color-surface-container-high: #272A24;
  --md-sys-color-surface-container-highest: #32352E;
  --md-sys-color-on-surface: #E2E3DC;
  --md-sys-color-on-surface-variant: #C2C7BA;
  --md-sys-color-outline: #8C9184;
  --md-sys-color-outline-variant: #43483D;
  --md-sys-color-inverse-surface: #E2E3DC;
  --md-sys-color-on-inverse-surface: #313430;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
  --md-sys-elevation-2: 0 1px 3px rgba(0,0,0,.5), 0 3px 8px 2px rgba(0,0,0,.4);
  --md-sys-elevation-3: 0 6px 12px rgba(0,0,0,.55), 0 12px 32px rgba(0,0,0,.5);
}

/* ---------- 基础 ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

/* ---------- iOS 连续曲率圆角（squircle） ----------
   曲线本身沿用 Apple 图标的超椭圆：CSS superellipse(k) 与数学指数 n 的关系是 n = 2k，
   故 k = 2.6 ≈ 图标实测的 n≈5.2（比 squircle 关键字的 n=4 更贴近）。
   圆角尺寸走 iOS 26/27 组件风，比图标的 22.37% 更圆润：格子取短边 26%。
   外层棋盘按同心圆角（concentric corner）由内层反推，而非独立取值：
     R_棋盘 = R_格子 + 内边距 ≈ 480×22.1%×26% + 12.1px ≈ 39.6px ≈ 8.2%
   这样四角方格与外框曲率严丝合缝。棋盘被 480px 上限截断时内边距占比略有出入
   （2.40%~2.52%），误差 <0.5px，取 8.2%。
   corner-shape 目前仅 Chromium 系支持，其余浏览器回落到普通圆弧。
   半径始终用百分比、不设固定 px 回落：小屏上棋盘等比缩小，
   圆角占比与电脑版保持一致（固定 px 只在 480px 棋盘下等价，小屏会偏圆）。 */
:root {
  --ios-curve: superellipse(2.6);
  --ios-cell-radius: 26%;
  --ios-board-radius: 8.2%;
}
.board, .board-bg :where(span), .inner, .score-card,
.palette-option, .palette-swatch i, .dialog.settings,
.bg-pick, .bg-pick-preview { corner-shape: var(--ios-curve); }
body {
  font-family: var(--font-ui);
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
  transition: background-color .35s var(--md-sys-easing), color .35s var(--md-sys-easing);
  overflow-x: hidden;
}
/* ---------- 页面背景：纯色底 + 自定义图片 + 毛玻璃层 ---------- */
.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: var(--md-sys-color-surface);
  transition: opacity .35s var(--md-sys-easing);
}
.scene-glass {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--md-sys-color-surface) 62%, transparent);
  backdrop-filter: blur(16px) saturate(1.1);
  -webkit-backdrop-filter: blur(16px) saturate(1.1);
  transition: background-color .35s var(--md-sys-easing);
}
[data-theme="dark"] .scene-glass {
  background: color-mix(in srgb, var(--md-sys-color-surface) 54%, transparent);
}
/* ---------- 自定义背景层：毛玻璃之下 ----------
   .custom-ready 只在图片确认加载成功后加上，
   避免自定义地址失效时先黑一下再回退 */
.scene-custom {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity .45s var(--md-sys-easing);
}
.scene.custom-ready .scene-custom { opacity: 1; }
/* 自定义背景不压毛玻璃，只留一层轻遮罩保证文字可读；
   模糊度由 --scene-custom-filter 控制（设置里的滑块），0 时保持无模糊 */
.scene.custom-ready .scene-glass {
  background: color-mix(in srgb, var(--md-sys-color-surface) 24%, transparent);
  backdrop-filter: var(--scene-custom-filter, none);
  -webkit-backdrop-filter: var(--scene-custom-filter, none);
}
[data-theme="dark"] .scene.custom-ready .scene-glass {
  background: rgba(0, 0, 0, .34);
}
html[data-bg="off"] .scene { opacity: 0; }

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  padding: clamp(14px, 3.5vh, 30px) clamp(16px, 5vw, 28px) 24px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;   /* 宽屏/全屏有余量时整列垂直居中 */
  flex: 1;
}

/* ---------- 头部 ---------- */
.app-bar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  transition: translate .3s var(--md-sys-easing), scale .3s var(--md-sys-easing);
}
.logo {
  font-size: clamp(46px, 13vw, 64px);
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: .95;
  background: linear-gradient(135deg, var(--md-sys-color-primary), var(--md-sys-color-secondary));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--md-sys-color-primary);
}
.subtitle {
  margin-top: 6px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .02em;
  color: var(--md-sys-color-on-surface-variant);
}

.score-row { display: flex; gap: 10px; flex-shrink: 0; }
.score-card {
  --card-shadow: 0 12px 26px -18px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.04),
                 inset 0 1px 0 rgba(255,255,255,.40);
  position: relative;
  min-width: 90px;
  padding: 11px 18px 10px;
  border-radius: 20px;
  border: 1px solid color-mix(in srgb, var(--md-sys-color-on-surface) 9%, transparent);
  background:
    linear-gradient(155deg, rgba(255,255,255,.30), rgba(255,255,255,0) 58%),
    color-mix(in srgb, var(--md-sys-color-surface-container) 78%, transparent);
  box-shadow: var(--card-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(1.06);
  backdrop-filter: blur(12px) saturate(1.06);
  text-align: center;
  overflow: hidden;
  transition: background-color .35s var(--md-sys-easing), border-color .35s var(--md-sys-easing);
}
[data-theme="dark"] .score-card {
  --card-shadow: 0 14px 28px -18px rgba(0,0,0,.60), 0 1px 2px rgba(0,0,0,.35),
                 inset 0 1px 0 rgba(255,255,255,.07);
  border-color: color-mix(in srgb, var(--md-sys-color-on-surface) 13%, transparent);
  background:
    linear-gradient(155deg, rgba(255,255,255,.055), rgba(255,255,255,0) 58%),
    color-mix(in srgb, var(--md-sys-color-surface-container) 68%, transparent);
}
/* 标签与数字之间的细饰线 */
.score-card::before {
  content: '';
  display: block;
  width: 16px;
  height: 1px;
  margin: 6px auto 5px;
  background: linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--md-sys-color-primary) 55%, transparent), transparent);
}
#bestCard::before {
  background: linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--record-gold) 70%, transparent), transparent);
}
.score-card .label {
  display: block;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .24em;
  text-indent: .24em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 88%, transparent);
}
.score-card .value {
  display: block;
  font-size: 26px;
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: .005em;
  font-variant-numeric: tabular-nums lining-nums;
  color: var(--md-sys-color-on-surface);
  font-family: var(--font-ui);
}
/* 破纪录专属动画：金色光晕脉冲 + 数字 pop */
.score-card.record { animation: record-glow 1.8s var(--md-sys-easing); }
@keyframes record-glow {
  0%, 100% { box-shadow: var(--card-shadow); transform: scale(1); }
  18% {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--record-gold) 45%, transparent),
                0 0 26px color-mix(in srgb, var(--record-gold) 80%, transparent);
    transform: scale(1.045);
  }
  45% { transform: scale(1); }
  75% {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--record-gold) 28%, transparent),
                0 0 14px color-mix(in srgb, var(--record-gold) 55%, transparent);
  }
}
.score-card.record .value { animation: record-value .6s var(--md-sys-easing); }
@keyframes record-value {
  0% { transform: scale(1); color: var(--md-sys-color-on-surface); }
  35% { transform: scale(1.22); color: var(--record-gold); }
  100% { transform: scale(1); color: var(--md-sys-color-on-surface); }
}

/* ---------- 设置按钮 ---------- */
/* 与操作按钮同高（38px）、同圆角、同容器色 */
.icon-btn {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border: none;
  border-radius: 19px;
  background: var(--md-sys-color-surface-container);
  color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s var(--md-sys-easing), color .2s var(--md-sys-easing), translate .3s var(--md-sys-easing), scale .3s var(--md-sys-easing);
}
.icon-btn:hover {
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, var(--md-sys-color-surface-container));
}
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
/* 撤销图标：圆弧走线稿、箭头填充；24px 光学尺寸让圆环与齿轮视觉等大 */
#undoBtn svg, .new-game-icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
/* 平板模式的新游戏图标：撤销图标的水平镜像（箭头朝右）；横排时仍显示文字 */
.new-game-icon { display: none; }
.icon-btn:disabled { opacity: .38; cursor: default; }
.icon-btn:disabled:hover { background: var(--md-sys-color-surface-container); }
.segmented {
  position: relative;
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: 24px;
  background: var(--md-sys-color-surface-container);
  box-shadow: inset 0 0 0 1px var(--md-sys-color-outline-variant);
}
/* 高亮滑块：切换时滑动过渡 */
.segment-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  height: calc(100% - 6px);
  width: 0;
  border-radius: 21px;
  background: var(--md-sys-color-secondary-container);
  box-shadow: var(--md-sys-elevation-1);
  transition: transform .34s var(--md-sys-easing), width .34s var(--md-sys-easing);
  pointer-events: none;
  z-index: 0;
}
.segment {
  position: relative;
  z-index: 1;
  border: none;
  background: transparent;
  color: var(--md-sys-color-on-surface-variant);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .02em;
  padding: 8px 18px;
  border-radius: 21px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s var(--md-sys-easing), color .22s var(--md-sys-easing);
}
.segment svg { width: 15px; height: 15px; flex-shrink: 0; }
.segment:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent); }
.segment.active {
  background: transparent;   /* 高亮由滑块承担 */
  color: var(--md-sys-color-on-secondary-container);
}
.segment.active:hover { background: transparent; }

/* ---------- 操作按钮 ---------- */
.actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: clamp(22px, 4.5vh, 34px);
}
.btn {
  position: relative;
  overflow: hidden;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .02em;
  height: 38px;
  padding: 0 20px;
  border-radius: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow .2s var(--md-sys-easing), filter .2s var(--md-sys-easing), transform .1s var(--md-sys-easing), translate .3s var(--md-sys-easing), scale .3s var(--md-sys-easing);
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn.filled {
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  box-shadow: var(--md-sys-elevation-1);
}
.btn.filled:hover { box-shadow: var(--md-sys-elevation-2); filter: brightness(1.05); }
.btn.tonal {
  background: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
}
.btn.tonal:hover { box-shadow: var(--md-sys-elevation-1); filter: brightness(.98); }
.btn:disabled {
  opacity: .38;
  box-shadow: none;
  cursor: default;
  filter: none;
}

/* 波纹 */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: .32;
  transform: scale(0);
  animation: ripple .55s var(--md-sys-easing) forwards;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* 新一局：棋盘淡入 */
.board.regen { animation: board-in .32s var(--md-sys-easing); }
@keyframes board-in {
  from { opacity: 0; transform: translateY(8px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 语言切换过渡：界面文本淡出/淡入 */
[data-i18n], #bestLabel {
  transition: opacity .14s var(--md-sys-easing), transform .14s var(--md-sys-easing);
}
.lang-fade { opacity: 0; transform: translateY(3px); }

/* ---------- 游戏板 ---------- */
.board-wrap { display: flex; flex-direction: column; align-items: center; transition: translate .3s var(--md-sys-easing), scale .3s var(--md-sys-easing); }
.board {
  position: relative;
  width: min(100%, 480px);
  aspect-ratio: 1;
  --gap: 2.4%;
  padding: var(--gap);
  border-radius: var(--ios-board-radius);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-on-surface) 9%, transparent);
  background:
    linear-gradient(155deg, rgba(255,255,255,.30), rgba(255,255,255,0) 58%),
    color-mix(in srgb, var(--md-sys-color-surface-container) 78%, transparent);
  box-shadow: 0 12px 26px -18px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.04),
              inset 0 1px 0 rgba(255,255,255,.40);
  -webkit-backdrop-filter: blur(12px) saturate(1.06);
  backdrop-filter: blur(12px) saturate(1.06);
  transition: background-color .35s var(--md-sys-easing), border-color .35s var(--md-sys-easing);
  touch-action: none;
}
[data-theme="dark"] .board {
  border-color: color-mix(in srgb, var(--md-sys-color-on-surface) 13%, transparent);
  background:
    linear-gradient(155deg, rgba(255,255,255,.055), rgba(255,255,255,0) 58%),
    color-mix(in srgb, var(--md-sys-color-surface-container) 68%, transparent);
  box-shadow: 0 14px 28px -18px rgba(0,0,0,.60), 0 1px 2px rgba(0,0,0,.35),
              inset 0 1px 0 rgba(255,255,255,.07);
}
.board-bg {
  position: absolute;
  inset: var(--gap);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
}
.board-bg :where(span) {
  border-radius: var(--ios-cell-radius);
  background: var(--md-sys-color-surface-container-highest);
  transition: background-color .35s var(--md-sys-easing);
  user-select: none;
}
/* 空格底：棋盘网格只作背景，数字由上层常驻方块呈现 */
.board-bg span.cell {
  border: 1px solid color-mix(in srgb, var(--md-sys-color-on-surface) 7%, transparent);
  background: color-mix(in srgb, var(--md-sys-color-surface-container-highest) 56%, transparent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
}
[data-theme="dark"] .board-bg span.cell {
  border-color: color-mix(in srgb, var(--md-sys-color-on-surface) 11%, transparent);
  background: color-mix(in srgb, var(--md-sys-color-surface-container-highest) 50%, transparent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.tiles {
  position: absolute;
  inset: var(--gap);
  --cell: calc((100% - 3 * var(--gap)) / 4);   /* 格子尺寸（与 board-bg 网格一致） */
}

/* ============================================================
   常驻方块层：四层各司一个 transform，互不覆盖，
   所以滑行、拖拽挤压、模糊融合、入场能够同帧并行。
     .tile   位置层 —— translate(x,y)，滑行与跟手拖拽只写这里
     .sq     挤压层 —— 沿滑动轴压缩、垂直轴鼓起，origin 钉在被顶住的边上
     .fx     光学层 —— blur / opacity，负责雾化融合与入场
     .inner  材质层 —— M3 配色、圆角、内高光、投影，合并时做回弹脉冲
   投影挂在 .inner 上，会随 .sq 一起被压扁，光影自然跟住形变。
   ============================================================ */
.tiles {
  position: absolute;
  inset: var(--gap);
  --cell: calc((100% - 3 * var(--gap)) / 4);   /* 格子尺寸（与 board-bg 网格一致） */
}
.tile {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cell);
  height: var(--cell);
  transform: translate(0, 0);
  pointer-events: none;
  will-change: transform;
}
.sq {
  width: 100%;
  height: 100%;
  transform-origin: 50% 50%;
  will-change: transform;
}
.fx {
  width: 100%;
  height: 100%;
  will-change: filter, opacity;
}
.inner {
  width: 100%;
  height: 100%;
  border-radius: var(--ios-cell-radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: clamp(22px, 6.6vmin, 42px);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  user-select: none;
  box-shadow: var(--md-sys-elevation-1), inset 0 1px 0 rgba(255,255,255,.24);
}
[data-theme="dark"] .inner {
  box-shadow: var(--md-sys-elevation-1), inset 0 1px 0 rgba(255,255,255,.08);
}
.inner.tile--3 { font-size: clamp(19px, 5.7vmin, 36px); }
.inner.tile--4 { font-size: clamp(16px, 4.8vmin, 30px); }
.inner.tile--5 { font-size: clamp(13px, 4vmin, 25px); }

/* 新块入场：雾化散开 → 轻微过冲 → 落定 */
@keyframes spawn {
  0%   { opacity: 0; filter: blur(10px); transform: scale(.55); }
  55%  { opacity: 1; filter: blur(2px);  transform: scale(1.06); }
  100% { opacity: 1; filter: blur(0);    transform: scale(1); }
}
.fx.spawn { animation: spawn .42s cubic-bezier(.3,1.1,.45,1) backwards; }

/* ---------- 终局破碎：结束后点「再来一局」，整个盘面的方块炸成碎片 ---------- */
.shatter-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}
.shatter-shard {
  position: absolute;
  left: 0;
  top: 0;
}
.shatter-shard > .inner {
  position: absolute;
  left: 0;
  top: 0;
}
.shatter-flash {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0, rgba(255,255,255,0) 68%);
}

/* ===== 国风配色（默认；浅色/深色通用）：毛绿→青矾绿→深绿→苍绿→群青→湘蓝→螺甸紫→山黎豆红→野菊紫→栗棕→流黄 ===== */
.tile-2    { background: #66C18C; color: #0C2E1E; }
.tile-4    { background: #2C9678; color: #0A2E20; }
.tile-8    { background: #0D5E3A; color: #EAF6EF; }
.tile-16   { background: #223E36; color: #D6E4DE; }
.tile-32   { background: #1772B4; color: #FFFFFF; }
.tile-64   { background: #4A76A8; color: #FFFFFF; }
.tile-128  { background: #74759B; color: #F0F0F8; box-shadow: var(--md-sys-elevation-2), inset 0 0 18px rgba(255,255,255,.10); }
.tile-256  { background: #C27C88; color: #33141B; box-shadow: var(--md-sys-elevation-2), inset 0 0 18px rgba(255,255,255,.10); }
.tile-512  { background: #525288; color: #E6E7F4; box-shadow: var(--md-sys-elevation-2), inset 0 0 18px rgba(255,255,255,.08); }
.tile-1024 { background: #5C1E19; color: #F2E0DC; box-shadow: var(--md-sys-elevation-2), inset 0 0 18px rgba(255,255,255,.08); }
.tile-2048 { background: #D4A017; color: #221703; box-shadow: var(--md-sys-elevation-3), inset 0 0 24px rgba(255,230,150,.35), 0 0 40px rgba(212,160,23,.45); }

/* ===== 经典配色（浅色）：绿金双阶，统一深墨绿数字 ===== */
[data-palette="classic"] .tile-2    { background: #CBE7D3; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-4    { background: #A9D6B6; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-8    { background: #84C498; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-16   { background: #5DAE7C; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-32   { background: #3D9462; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-64   { background: #327F53; color: #1E3322; box-shadow: none; }
[data-palette="classic"] .tile-128  { background: #E9C47B; color: #1E3322; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,236,180,.35); }
[data-palette="classic"] .tile-256  { background: #DBAC4E; color: #1E3322; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,236,180,.3); }
[data-palette="classic"] .tile-512  { background: #C7933A; color: #1E3322; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,240,200,.25); }
[data-palette="classic"] .tile-1024 { background: #B5822C; color: #1E3322; box-shadow: var(--md-sys-elevation-2), inset 0 0 24px rgba(255,240,200,.25); }
[data-palette="classic"] .tile-2048 { background: #A6741F; color: #1E3322; box-shadow: var(--md-sys-elevation-3), inset 0 0 28px rgba(255,236,180,.32), 0 0 38px rgba(221,174,85,.45); }

/* 经典配色（深色）：原始 Material 绿色阶 —— data-palette="classic" 时覆盖国风色板 */
[data-theme="dark"][data-palette="classic"] .tile-2    { background: #24352B; color: #9FBFAA; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-4    { background: #2C4536; color: #A9C8B3; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-8    { background: #355642; color: #C8DCCE; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-16   { background: #3F6850; color: #E6F0E8; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-32   { background: #4A7A5E; color: #FFFFFF; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-64   { background: #568D6C; color: #FFFFFF; box-shadow: none; }
[data-theme="dark"][data-palette="classic"] .tile-128  { background: #64A07B; color: #0B2414; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,255,255,.12); }
[data-theme="dark"][data-palette="classic"] .tile-256  { background: #74B38B; color: #0B2414; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,255,255,.12); }
[data-theme="dark"][data-palette="classic"] .tile-512  { background: #85C69B; color: #0B2414; box-shadow: var(--md-sys-elevation-2), inset 0 0 20px rgba(255,255,255,.14); }
[data-theme="dark"][data-palette="classic"] .tile-1024 { background: #98D9AC; color: #0B2414; box-shadow: var(--md-sys-elevation-2), inset 0 0 22px rgba(255,255,255,.16); }
[data-theme="dark"][data-palette="classic"] .tile-2048 { background: #ACEBBF; color: #0B2414; box-shadow: var(--md-sys-elevation-3), inset 0 0 26px rgba(255,255,255,.3), 0 0 38px rgba(166,207,178,.4); }

/* ---------- Snackbar ---------- */
.snackbar {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 24px);
  min-width: 220px;
  max-width: min(88vw, 420px);
  padding: 13px 18px;
  border-radius: 8px;
  background: var(--md-sys-color-inverse-surface);
  color: var(--md-sys-color-on-inverse-surface);
  font-size: 13.5px;
  font-weight: 400;
  letter-spacing: .02em;
  box-shadow: var(--md-sys-elevation-3);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s var(--md-sys-easing), transform .25s var(--md-sys-easing);
  z-index: 60;
  text-align: center;
}
.snackbar.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Dialog（毛玻璃遮罩：blur 只保留在 scrim 一层，避免嵌套伪影） ---------- */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(22, 30, 24, .30);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .24s var(--md-sys-easing);
  z-index: 50;
}
[data-theme="dark"] .scrim {
  background: rgba(4, 6, 4, .48);
}
.scrim.show { opacity: 1; pointer-events: auto; }
.dialog {
  /* 同心圆角推算用的两个量：面板左右内边距、内层卡片圆角 */
  --dialog-pad-x: 28px;
  --dialog-card-radius: 16px;
  width: min(100%, 360px);
  border-radius: 28px;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
  box-shadow: var(--md-sys-elevation-3);
  padding: 30px var(--dialog-pad-x) 20px;
  transform: scale(.92) translateY(12px);
  transition: transform .26s var(--md-sys-easing);
}
.scrim.show .dialog { transform: scale(1) translateY(0); }

/* ---------- 弹层打开：背后界面整体下沉（类 iOS 模态呈现） ----------
   下沉施加在 translate/scale 独立属性上，而不是 transform .app——
   平板模式下 .actions 与全屏按钮是 fixed 定位，transform 祖先会劫持其
   包含块；独立属性也与按钮自身的 transform 按压反馈互不覆盖 */
html[data-modal="open"] .app-bar,
html[data-modal="open"] .board-wrap,
html[data-modal="open"] .actions > * {
  translate: 0 18px;
  scale: .94;
}
.dialog h2 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: 10px;
}
.dialog p {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--md-sys-color-on-surface-variant);
  margin-bottom: 6px;
}
.dialog .final-score {
  font-size: 15px;
  font-weight: 600;
  color: var(--md-sys-color-primary);
  margin-bottom: 16px;
}
/* ---------- 设置面板（二级页面） ---------- */
.dialog.settings {
  /* 同心圆角：外框曲率与内层选项卡对齐，R = 卡片圆角 + 内边距 */
  border-radius: calc(var(--dialog-card-radius) + var(--dialog-pad-x));
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
}
.settings .section-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
  margin: 4px 0 10px;
}
.palette-section {
  margin-bottom: 10px;
}
.palette-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.palette-option {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--dialog-card-radius);
  border: 1px solid var(--md-sys-color-outline-variant);
  background: transparent;
  color: var(--md-sys-color-on-surface);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .2s var(--md-sys-easing), background-color .2s var(--md-sys-easing);
}
.palette-option:hover { border-color: var(--md-sys-color-outline); }
.palette-option.active {
  border-color: var(--md-sys-color-primary);
  background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
}
.palette-swatch { display: flex; gap: 4px; flex-shrink: 0; }
.palette-swatch i { width: 22px; height: 22px; border-radius: 26%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.palette-name { display: flex; flex-direction: column; line-height: 1.35; }
.palette-name small {
  font-weight: 400;
  font-size: 12px;
  color: var(--md-sys-color-on-surface-variant);
}
.settings .segmented { margin-bottom: 6px; }
/* ---------- 平板模式开关 ---------- */
.setting-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 10px;
}
.setting-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  cursor: pointer;
}
.setting-title {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .01em;
  color: var(--md-sys-color-on-surface);
}
.setting-desc {
  font-size: 12px;
  line-height: 1.45;
  color: var(--md-sys-color-on-surface-variant);
}
.switch {
  position: relative;
  flex: none;
  width: 52px;
  height: 32px;
  padding: 0;
  border: 2px solid var(--md-sys-color-outline);
  border-radius: 16px;
  background: var(--md-sys-color-surface-container-highest);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s var(--md-sys-easing), border-color .2s var(--md-sys-easing),
              box-shadow .2s var(--md-sys-easing);
}
.switch:hover { box-shadow: var(--md-sys-elevation-1); }
.switch-thumb {
  position: absolute;
  top: 50%;
  left: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--md-sys-color-outline);
  transform: translateY(-50%);
  transition: left .22s var(--md-sys-easing), width .22s var(--md-sys-easing),
              height .22s var(--md-sys-easing), background-color .2s var(--md-sys-easing);
}
.switch[aria-checked="true"] {
  border-color: var(--md-sys-color-primary);
  background: var(--md-sys-color-primary);
}
.switch[aria-checked="true"] .switch-thumb {
  left: 22px;
  width: 24px;
  height: 24px;
  background: var(--md-sys-color-on-primary);
}
.switch:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 3px;
}
/* ---------- 背景上传框：只在「自定义」下出现 ---------- */
.bg-pick {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 12px 0 6px;
  padding: 11px 14px;
  border: 1.5px dashed var(--md-sys-color-outline);
  border-radius: var(--dialog-card-radius);
  background: color-mix(in srgb, var(--md-sys-color-surface-container) 62%, transparent);
  color: var(--md-sys-color-on-surface-variant);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .01em;
  text-align: left;
  cursor: pointer;
  transition: background-color .2s var(--md-sys-easing), border-color .2s var(--md-sys-easing);
}
.bg-pick:hover {
  border-color: var(--md-sys-color-primary);
  background: color-mix(in srgb, var(--md-sys-color-primary) 7%, var(--md-sys-color-surface-container));
}
.bg-pick:active { transform: scale(.99); }
.bg-pick[hidden] { display: none; }
.bg-pick-icon {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bg-pick-icon.is-hidden { display: none; }
.bg-pick-preview {
  width: 32px;
  height: 32px;
  flex: none;
  object-fit: cover;
  /* 跟随弹窗全局圆角等比缩放，与同心圆角体系协调 */
  border-radius: calc(var(--dialog-card-radius) * .5);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .10);
}
.bg-pick-preview[hidden] { display: none; }
.bg-pick-text { flex: none; }
.bg-pick-name {
  margin-left: auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 400;
  opacity: .75;
}
/* 行内右端圆形 ×：与左侧 32px 缩略图同尺寸（圆即同心圆体系的极限形态），
   仅在已选图时出现，点击清除图片并回到「关」 */
.bg-cancel {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
  color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s var(--md-sys-easing), color .2s var(--md-sys-easing);
}
.bg-cancel:hover {
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 16%, transparent);
  color: var(--md-sys-color-on-surface);
}
.bg-cancel:active { transform: scale(.94); }
.bg-cancel[hidden] { display: none; }
.bg-cancel svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
}
.bg-cancel:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 2px;
}
/* 上传行已由 <button> 改为 div[role=button]：补上与其它控件一致的键盘焦点环 */
.bg-pick:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 3px;
}
.bg-error {
  margin: 0 0 6px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--md-sys-color-error);
}
.bg-error[hidden] { display: none; }
/* ---------- 自定义背景毛玻璃模糊度滑块 ---------- */
.bg-blur-row {
  margin: 12px 0 10px;
}
.bg-blur-row[hidden] { display: none; }
.bg-blur-row .setting-row {
  margin-bottom: 8px;
}
.bg-blur-range {
  --bg-blur-fill: 0%;
  display: block;
  width: 100%;
  height: 32px;
  margin: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.bg-blur-range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(to right,
    var(--md-sys-color-primary) var(--bg-blur-fill),
    color-mix(in srgb, var(--md-sys-color-outline) 40%, transparent) var(--bg-blur-fill));
}
.bg-blur-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -7px;
  border: 2px solid var(--md-sys-color-surface-container-lowest);
  border-radius: 50%;
  background: var(--md-sys-color-primary);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
}
.bg-blur-range::-moz-range-track {
  height: 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--md-sys-color-outline) 40%, transparent);
}
.bg-blur-range::-moz-range-progress {
  height: 4px;
  border-radius: 999px;
  background: var(--md-sys-color-primary);
}
.bg-blur-range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 2px solid var(--md-sys-color-surface-container-lowest);
  border-radius: 50%;
  background: var(--md-sys-color-primary);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
}
.bg-blur-range:focus-visible {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: 4px;
  border-radius: 999px;
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}
.btn.text {
  background: transparent;
  color: var(--md-sys-color-primary);
  box-shadow: none;
}
.btn.text:hover { background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent); }

/* ---------- 全屏按钮（视口右下角悬浮） ---------- */
/* 与顶栏按钮同风格：纯色容器色、胶囊圆角、状态层 hover、elevation-1 */
.fab {
  position: fixed;
  right: clamp(14px, 5vw, 28px);
  bottom: clamp(14px, 3.5vh, 30px);
  z-index: 5;                    /* 高于 .app(1)，低于弹窗遮罩(50) */
  width: 46px;
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 23px;
  background: var(--md-sys-color-surface-container);
  box-shadow: var(--md-sys-elevation-1);
  color: var(--md-sys-color-on-surface-variant);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s var(--md-sys-easing), color .2s var(--md-sys-easing),
              box-shadow .2s var(--md-sys-easing), transform .1s var(--md-sys-easing),
              translate .3s var(--md-sys-easing), scale .3s var(--md-sys-easing);
}
/* .fab 的 display 声明会盖掉 UA 的 [hidden]{display:none}，必须显式补回 */
.fab[hidden] { display: none; }
.fab:hover {
  background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, var(--md-sys-color-surface-container));
  color: var(--md-sys-color-on-surface);
  box-shadow: var(--md-sys-elevation-2);
}
.fab:active { transform: scale(.97); }
.fab svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.fab .fab-exit { display: none; }
.fab.is-full .fab-enter { display: none; }
.fab.is-full .fab-exit { display: inline; }

/* ---------- 平板模式：三个操作按钮停靠屏幕右端，纵向排列 ----------
   按钮统一为 69px 圆形（全屏按钮 46px 的 1.5 倍），等宽等高保证圆心同轴；
   只在有足够横向空间时停靠；手机分辨率下改为停靠屏幕底部居中（见下方手机媒体查询） */
@media (min-width: 700px) {
  html[data-tablet="on"] .actions {
    position: fixed;
    top: calc(50% - 115.5px);  /* 231px 列高的一半；不用 transform 居中，
                                   否则 .actions 会成为 fixed 全屏按钮的包含块 */
    right: calc(clamp(14px, 3vw, 28px) + env(safe-area-inset-right, 0px));
    z-index: 4;                  /* 高于 .app(1)，低于弹窗遮罩(50) */
    width: 69px;
    flex-direction: column;
    gap: 12px;
    margin: 0;
  }
  html[data-tablet="on"] .actions > .icon-btn,
  html[data-tablet="on"] #newGameBtn {
    width: 69px;
    height: 69px;
    flex: none;
    border-radius: 50%;
  }
  html[data-tablet="on"] #settingsBtn svg {
    width: 30px;
    height: 30px;
  }
  html[data-tablet="on"] #undoBtn svg,
  html[data-tablet="on"] .new-game-icon {
    width: 36px;
    height: 36px;
    stroke-width: 2.85;
  }

<script>
'use strict';

/* ============================================================
   核心逻辑（纯函数，无 DOM 依赖 —— 可无头测试）
   ============================================================ */
const GameCore = (() => {
  const N = 4;
  const idx = (r, c) => r * N + c;

  /* 每行抽取/写回的方向映射 */
  const LINES = {
    up:    { get: (g, r, c) => g[idx(c, r)],           set: (g, r, c, v) => g[idx(c, r)] = v },
    down:  { get: (g, r, c) => g[idx(N - 1 - c, r)],   set: (g, r, c, v) => g[idx(N - 1 - c, r)] = v },
    left:  { get: (g, r, c) => g[idx(r, c)],           set: (g, r, c, v) => g[idx(r, c)] = v },
    right: { get: (g, r, c) => g[idx(r, N - 1 - c)],   set: (g, r, c, v) => g[idx(r, N - 1 - c)] = v },
  };

  function emptyGrid() { return new Array(N * N).fill(0); }

  /* 单行滑动合并：一次只合并一对 */
  function slideLine(line) {
    const vals = line.filter(v => v !== 0);
    const out = new Array(N).fill(0);
    let score = 0, j = 0;
    for (let i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        out[j] = vals[i] * 2;
        score += vals[i] * 2;
        i++;
      } else {
        out[j] = vals[i];
      }
      j++;
    }
    let moved = false;
    for (let k = 0; k < N; k++) if (out[k] !== line[k]) moved = true;
    return { line: out, score, moved };
  }

  /* 移动整个盘面（不修改原数组） */
  function move(grid, dir) {
    if (!LINES[dir]) throw new Error('bad direction: ' + dir);
    const out = emptyGrid();
    let score = 0, moved = false;
    for (let r = 0; r < N; r++) {
      const line = [];
      for (let c = 0; c < N; c++) line.push(LINES[dir].get(grid, r, c));
      const res = slideLine(line);
      for (let c = 0; c < N; c++) LINES[dir].set(out, r, c, res.line[c]);
      score += res.score;
      moved = moved || res.moved;
    }
    return { grid: out, score, moved };
  }

  /* 在空位生成 2（90%）或 4（10%）；rng 可注入便于测试 */
  function addRandomTile(grid, rng) {
    rng = rng || Math.random;
    const empties = [];
    grid.forEach((v, i) => { if (v === 0) empties.push(i); });
    if (empties.length === 0) return null;
    const pos = empties[Math.floor(rng() * empties.length)];
    grid[pos] = rng() < 0.9 ? 2 : 4;
    return pos;
  }

  function hasWon(grid) { return grid.some(v => v >= 2048); }
  function maxValue(grid) { return grid.reduce((a, v) => Math.max(a, v), 0); }

  function canMove(grid) {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = grid[idx(r, c)];
        if (v === 0) return true;
        if (c + 1 < N && grid[idx(r, c + 1)] === v) return true;
        if (r + 1 < N && grid[idx(r + 1, c)] === v) return true;
      }
    }
    return false;
  }

  /* 计算每个 tile 的目标位置（供 DOM 动画层使用，须与 move() 结果一致）。
     输入: [{id, row, col, value}...]；输出: [{id, target:{row,col}, merged, dead}]。
     merged=true 表示该 tile 存活并增值；dead=true 表示被合并移除。 */
  function planTiles(tiles, dir) {
    const horizontal = dir === 'left' || dir === 'right';
    const cmp = {
      up:    (a, b) => a.row - b.row,
      down:  (a, b) => b.row - a.row,
      left:  (a, b) => a.col - b.col,
      right: (a, b) => b.col - a.col,
    }[dir];
    const res = new Map();
    const reverse = (dir === 'down' || dir === 'right');
    for (let i = 0; i < N; i++) {
      /* left/right 按行分组，up/down 按列分组 */
      const line = tiles.filter(t => (horizontal ? t.row === i : t.col === i)).sort(cmp);
      let cursor = 0, prevId = null, prevValue = 0;
      for (const t of line) {
        /* 滑动方向的目标边：up/left 从 0 端开始，down/right 从 N-1 端反向 */
        const pos = reverse ? N - 1 - cursor : cursor;
        const info = {
          target: horizontal ? { row: i, col: pos } : { row: pos, col: i },
          merged: false,
          dead: false,
        };
        if (prevId !== null && !res.get(prevId).merged && prevValue === t.value) {
          info.target = res.get(prevId).target;
          info.dead = true;
          res.get(prevId).merged = true;
        } else {
          prevId = t.id;
          prevValue = t.value;
          cursor++;
        }
        res.set(t.id, info);
      }
    }
    return tiles.map(t => Object.assign({ id: t.id }, res.get(t.id)));
  }

  return { N, idx, emptyGrid, slideLine, move, planTiles, addRandomTile, hasWon, maxValue, canMove };
})();
